<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.2" baseProfile="tiny-ps"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 500 500"
  width="500" height="500">
  <title>Learn in Curve</title>

  <!-- White square background (required by BIMI spec) -->
  <rect x="0" y="0" width="500" height="500" fill="#FFFFFF"/>

  <!-- Left wing (darker burnt orange) -->
  <polygon points="130,78 28,198 175,198 175,78" fill="#C85F0A"/>

  <!-- Right wing (darker burnt orange) -->
  <polygon points="370,78 472,198 325,198 325,78" fill="#C85F0A"/>

  <!-- Left body panel (medium orange) -->
  <polygon points="28,198 175,198 250,422" fill="#E87820"/>

  <!-- Right body panel (medium orange) -->
  <polygon points="472,198 325,198 250,422" fill="#E87820"/>

  <!-- Centre body panel (lighter amber orange) -->
  <polygon points="175,198 325,198 250,422" fill="#F5922A"/>

  <!-- Top left ear flap (light orange) -->
  <polygon points="130,78 175,78 175,198 130,78" fill="#F5922A"/>

  <!-- Top right ear flap (light orange) -->
  <polygon points="370,78 325,78 325,198 370,78" fill="#F5922A"/>

  <!-- White notch cutout between ears -->
  <rect x="175" y="78" width="150" height="88" fill="#FFFFFF"/>
</svg>
