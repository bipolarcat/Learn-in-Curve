  Feedback survey email — Learn in Curve.
  Reference copy of the HTML used in the Gmail test draft.
  {{TOKEN}} is a placeholder — swap per recipient when sending the real
  batch (each of the 43 needs their own token from survey_invites).

  2026-07-07 update: links point at https://pmqin5days.learnincurve.com/survey
  — the live PMQ in 5 days domain, reverse-proxied (see its Caddyfile) to
  the Supabase Edge Function (supabase/functions/survey/index.ts). NOT the
  raw *.supabase.co URL: that triggered Gmail's "Redirect Notice"
  link-safety interstitial, because a long, machine-generated subdomain of
  a shared hosting domain like supabase.co is a common phishing signature,
  so Gmail (and likely other mail clients) doesn't treat it as a trusted
  destination and inserts a click-through warning. Proxying through a
  domain recipients already know and have already used avoids that.
  IMPORTANT: this only works once the PMQ in 5 days repo is redeployed with
  the updated Caddyfile — the raw supabase.co URL still works today if
  needed before that deploy happens. Copy shortened to match Sim's own
  edit of the previous draft.
-->
