      - region [ref=e48]:
        - heading "Most PMQ revision prepares you for the wrong exam" [level=2] [ref=e49]
        - paragraph [ref=e50]: The syllabus reads like a list of things to memorise, so that is usually how people revise it. Learn what goes in a business case, recite it back. However, very little of the paper asks you what something is. It gives you a situation and asks what you would do about it. Every question in here is written that way, because that is the paper you sit.
