      - region [ref=e170]:
        - generic [ref=e171]:
          - heading "FAQs" [level=2] [ref=e173]
          - list [ref=e174]:
            - listitem [ref=e175]:
              - button "Is it actually free?" [ref=e176] [cursor=pointer]:
                - generic [aria-hidden] [ref=e178]: ▼
              - paragraph [ref=e180]: Yes. The free plan does not expire and does not ask for a card. You get study content for all 24 learning objectives, a full set of practice questions, a complete 40-question mock paper, misconceptions and memory aids.
            - listitem [ref=e181]:
              - button "Is this official APM material?" [ref=e182] [cursor=pointer]:
                - generic [aria-hidden] [ref=e184]: ▼
              - paragraph [ref=e186]: No. Learn in Curve is not affiliated with or endorsed by APM. Everything here is written from scratch and aimed at their published syllabus.
            - listitem [ref=e187]:
              - button "How long do I really need?" [ref=e188] [cursor=pointer]:
                - generic [aria-hidden] [ref=e190]: ▼
              - paragraph [ref=e192]: Five days is the pace this is built around, and it assumes you are already working in a project environment. Starting from further back is fine. Nothing expires and your progress saves.
            - listitem [ref=e193]:
              - button "What is the APM Project Management Qualification?" [ref=e194] [cursor=pointer]:
                - generic [aria-hidden] [ref=e196]: ▼
              - paragraph [ref=e198]:
                - text: The APM Project Management Qualification (PMQ) is a knowledge-based, internationally recognised certification offered by the
                - link [ref=e199] [cursor=pointer]:
                  - /url: https://www.apm.org.uk/
                  - text: Association for Project Management (APM)
                - text: – the UK's chartered body for the project profession. It demonstrates your ability to understand and apply project management principles across a wide range of environments, from individual assignments to large-scale capital projects.
            - listitem [ref=e200]:
              - button "Who is this certification for?" [ref=e201] [cursor=pointer]:
                - generic [aria-hidden] [ref=e203]: ▼
              - paragraph [ref=e205]: The PMQ is ideal for professionals already working in a project environment – typically those with 2–3 years of experience – or those pursuing a project management degree or apprenticeship. It is the perfect next step after the APM Project Fundamentals Qualification (PFQ) if you want to deepen your expertise rather than focus on a single methodology.
            - listitem [ref=e206]:
              - button "How does it help your career?" [ref=e207] [cursor=pointer]:
                - generic [aria-hidden] [ref=e209]: ▼
              - paragraph [ref=e211]: Holding a PMQ signals to employers that you have a comprehensive, standardised understanding of project management. It serves as a stepping stone toward becoming a Chartered Project Professional (ChPP) – the industry's highest standard. Qualified project managers typically command higher salaries, and the certification is respected across sectors globally. You gain a toolkit of technical, commercial, and people-management skills – including risk, resource, and stakeholder management – that apply immediately to real-world projects.
            - listitem [ref=e212]:
              - button "What is the exam format?" [ref=e213] [cursor=pointer]:
                - generic [aria-hidden] [ref=e215]: ▼
              - paragraph [ref=e217]: "The exam lasts 2.5 hours and is split into two parts with an optional 30-minute break. You will encounter four question types: multiple response (selecting correct combinations), select from a list (filling in missing words), short response (a word, phrase, or sentence), and long response (written explanations of project scenarios). The exam is conducted online via remote proctoring – you can sit it from home or a location of your choice."
            - listitem [ref=e218]:
              - button "How do I book my exam?" [ref=e219] [cursor=pointer]:
                - generic [aria-hidden] [ref=e221]: ▼
              - paragraph [ref=e223]:
                - text: You can book directly through the
                - link [ref=e224] [cursor=pointer]:
                  - /url: https://www.apm.org.uk/qualifications-and-training/qualifications-find-out-more/open-exams/#pmq
                  - text: APM exam booking page
                - text: or via an accredited training provider. Self-study candidates can book an Open Online Exam directly on the APM website. Most candidates book through a training provider, which typically includes structured coursework and study materials.
