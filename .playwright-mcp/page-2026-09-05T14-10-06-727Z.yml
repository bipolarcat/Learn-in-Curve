                - 'link "Choosing a qualification APM PMQ vs PRINCE2: what''s the difference? PRINCE2 is a method: a defined way of running a project, with its own processes, roles and terminology. The APM PMQ is a broad body of knowledge, testing judgement across the whole discipline rather than one prescribed approach. Read guide" [ref=f7e192] [cursor=pointer]':
